[workspace]
name = "azo-plugin-swarms"
version = "0.1.0"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "osx-64"]

# Runtime dependencies are supplied by the integrated Agent Zoo host.
[tool.agent-zoo.plugin]
name = "azo-plugin-swarms"
common = ["src/swarm.py"]
default = []
rlm = []

[tasks]
test = "bash scripts/test.sh"

[tool.agent-zoo.plugin.config]
files = ["config/swarm.json", "config/worker_prompt.md", "skills/swarm/SKILL.md"]
